<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy 25th, Nessy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
:root{--ink:#1f3f7a;--paper:#fbf4e0;--gold:#f3d98a}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{overflow:hidden;color:var(--ink);font-family:'Patrick Hand',cursive;background:#efe5c8;
  background-image:repeating-linear-gradient(0deg,transparent 0 31px,rgba(31,63,122,.09) 31px 32px);
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
h1,h2{font-family:'Caveat',cursive;font-weight:700}

#curtain{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;
  background:#efe5c8 repeating-linear-gradient(0deg,transparent 0 31px,rgba(31,63,122,.09) 31px 32px);transition:opacity .8s;padding:24px}
#curtain.hide{opacity:0;pointer-events:none}
#curtain h1{font-size:clamp(3rem,13vw,5.5rem);line-height:1;transform:rotate(-2deg)}
#curtain svg.sq{width:min(320px,70vw);height:18px}
#curtain p{font-size:1.4rem}
#enterBtn{margin-top:12px;font:700 1.7rem 'Caveat',cursive;color:var(--ink);background:var(--gold);cursor:pointer;
  border:3px solid var(--ink);padding:6px 30px;border-radius:30px 12px 28px 14px/14px 28px 12px 30px;box-shadow:4px 5px 0 var(--ink);transform:rotate(1.5deg)}
#enterBtn:active{transform:translate(3px,4px);box-shadow:1px 1px 0 var(--ink)}

#room{position:fixed;inset:0}
#room[hidden]{display:none}
#scene{width:100%;height:100%;display:block}
@media (max-width:700px) and (orientation:portrait){
  #room{overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch}
  #scene{width:auto;height:100%;max-width:none}
}
#swipe{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:10;
  font:700 1.5rem 'Caveat',cursive;background:var(--gold);border:2.5px solid var(--ink);border-radius:20px 10px 18px 12px;
  padding:0 16px;white-space:nowrap;box-shadow:3px 3px 0 var(--ink);pointer-events:none;transition:opacity .8s;opacity:0}
#swipe.show{opacity:1}

/* svg doodle styles */
.k{fill:none;stroke:#1f3f7a;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.f1{fill:#cfe4f7}.f2{fill:#fbf4e0}.f3{fill:#f3d98a}.f4{fill:#f7b9d0}.f5{fill:#e8cb98}.f6{fill:#9cc4ea}.f7{fill:#a9d8b0}.f8{fill:#1f3f7a}.fn{fill:#243f78}.f9{fill:#14294f}
.t{fill:#1f3f7a;font-family:'Caveat',cursive;font-weight:700}
.hot{cursor:pointer;transform-box:fill-box;transform-origin:center}
.hot:hover{animation:wig .5s ease-in-out}
@keyframes wig{25%{transform:rotate(-1.6deg) scale(1.02)}75%{transform:rotate(1.6deg) scale(1.02)}}
.spin{transform-box:fill-box;transform-origin:center;animation:spinx 7s linear infinite}
@keyframes spinx{0%{transform:scaleX(1)}12.5%{transform:scaleX(.71)}25%{transform:scaleX(.05)}37.5%{transform:scaleX(-.71)}50%{transform:scaleX(-1)}62.5%{transform:scaleX(-.71)}75%{transform:scaleX(.05)}87.5%{transform:scaleX(.71)}100%{transform:scaleX(1)}}
.tw{pointer-events:none;transform-box:fill-box;transform-origin:center;animation:tw 3s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:0;transform:scale(.4) rotate(0)}50%{opacity:1;transform:scale(1.1) rotate(20deg)}}
.fl{fill:#ffb347;stroke:#1f3f7a;stroke-width:1.5;pointer-events:none;transform-box:fill-box;transform-origin:50% 100%;animation:flick 1.2s ease-in-out infinite}
.out .fl{display:none}
@keyframes flick{0%,100%{transform:scale(1)}50%{transform:scale(.8,.9)}}
.blob{pointer-events:none;animation:lava 6s ease-in-out infinite}
@keyframes lava{0%,100%{transform:translateY(8px)}50%{transform:translateY(-16px)}}

#overlay{position:fixed;inset:0;background:rgba(20,41,79,.55);display:flex;align-items:center;justify-content:center;z-index:30;padding:20px;opacity:0;pointer-events:none;transition:opacity .3s}
#overlay.show{opacity:1;pointer-events:auto}
#modal{position:relative;background:var(--paper) repeating-linear-gradient(0deg,transparent 0 27px,rgba(31,63,122,.13) 27px 28px);
  border:3px solid var(--ink);border-radius:14px 22px 16px 24px/22px 14px 24px 16px;box-shadow:6px 8px 0 rgba(31,63,122,.3);
  max-width:420px;width:100%;max-height:84vh;overflow-y:auto;padding:34px 28px 24px}
#modal::before{content:'';position:absolute;top:-13px;left:50%;width:96px;height:26px;background:rgba(243,217,138,.85);transform:translateX(-50%) rotate(-3deg)}
#closeModal{position:absolute;top:8px;right:14px;background:none;border:none;font:700 2rem 'Caveat';color:var(--ink);cursor:pointer}
#modalContent h2{font-size:2.3rem;line-height:1;margin-bottom:12px}
#modalContent p{font-size:1.2rem;line-height:28px;margin-bottom:14px}
.sig{text-align:right;font:700 1.7rem 'Caveat'}
.tools{display:flex;justify-content:center;gap:16px;margin-bottom:10px}
.tools svg{width:54px;height:54px}
.pol{background:#fff;border:2px solid var(--ink);padding:7px 7px 6px;width:150px;box-shadow:3px 4px 0 rgba(31,63,122,.25);text-align:center;font:700 1.25rem 'Caveat'}
.pol img{display:block;width:100%;height:200px;object-fit:contain;background:#fff;margin-bottom:4px;border:1.5px solid var(--ink)}
.pols{display:flex;justify-content:center;gap:18px;margin:8px 0 14px}
.pols .pol:first-child,.one{transform:rotate(-3deg)}.pols .pol:last-child{transform:rotate(3deg)}
.one{margin:6px auto 16px}
.vinyl{width:96px;height:96px;border-radius:50%;margin:0 auto 14px;border:3px solid var(--ink);animation:spin 4s linear infinite;
  background:radial-gradient(circle,var(--gold) 0 14%,var(--ink) 15% 100%);position:relative}
.vinyl::after{content:'';position:absolute;inset:6px;border-radius:50%;border:1.5px dashed rgba(251,244,224,.5)}
@keyframes spin{to{transform:rotate(360deg)}}
#toggleMusic{font:700 1.4rem 'Caveat';color:var(--ink);background:var(--gold);border:2.5px solid var(--ink);padding:2px 20px;border-radius:20px 10px 18px 12px;cursor:pointer;box-shadow:3px 3px 0 var(--ink)}

.album{position:relative;width:260px;height:340px;max-width:100%;margin:16px auto 14px;perspective:1200px}
.leaf{position:absolute;inset:0;transform-origin:left center;transform-style:preserve-3d;cursor:pointer;
  transition:transform .85s cubic-bezier(.45,.05,.25,1),opacity .3s ease .3s}
.leaf.flipped{transform:rotateY(-105deg);opacity:0;pointer-events:none}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;
  border:3px solid var(--ink);border-radius:4px 14px 14px 4px;box-shadow:3px 4px 0 rgba(31,63,122,.25)}
.face.back{transform:rotateY(180deg);background:#fbf4e0}
.pg{padding:16px 14px;background:#fff9ea repeating-linear-gradient(0deg,transparent 0 27px,rgba(31,63,122,.1) 27px 28px)}
.pg.ice{background:#e3f0fb repeating-linear-gradient(0deg,transparent 0 27px,rgba(31,63,122,.1) 27px 28px)}
.pg::before{content:'';position:absolute;left:4px;top:0;bottom:0;width:8px;background:radial-gradient(circle,rgba(31,63,122,.55) 2.5px,transparent 3.2px) 0 0/8px 46px repeat-y}
.cover{background:#9cc4ea;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center}
.cover::after{content:'';position:absolute;inset:10px;border:2px dashed rgba(31,63,122,.55);border-radius:3px;pointer-events:none}
.cover h3{font:700 2.3rem/1 'Caveat',cursive}
.cover small{font:700 1.2rem 'Caveat',cursive}
.bigp{width:100px;height:130px}
.ph{position:relative;width:218px;height:218px;background:#fff;border:2px solid var(--ink);padding:0;box-shadow:2px 3px 0 rgba(31,63,122,.2);margin-left:4px}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.tape{position:absolute;width:46px;height:15px;background:rgba(243,217,138,.85)}
.tape.t1{top:-7px;left:-12px;transform:rotate(-35deg)}.tape.t2{bottom:-5px;right:-12px;transform:rotate(-35deg)}
.cap{font:700 1.7rem/1 'Caveat',cursive;margin:12px 0 2px 4px}
.sub{font-size:1rem;line-height:1.1;margin-left:4px;max-width:150px}
.deco{position:absolute;right:6px;bottom:6px;width:90px;height:72px}
.flake{position:absolute;top:2px;right:10px;width:20px;height:20px}
.albumnav{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:6px}
.albumnav span{font:700 1.3rem 'Caveat',cursive;min-width:78px;text-align:center}
.nb{font:700 1.3rem 'Caveat',cursive;color:var(--ink);background:var(--gold);border:2.5px solid var(--ink);padding:0 14px;border-radius:18px 9px 16px 10px;cursor:pointer;box-shadow:2px 3px 0 var(--ink)}
.nb:disabled{opacity:.35;cursor:default}
</style>
</head>

const NS='http://www.w3.org/2000/svg', art=document.getElementById('art');
function el(t,a,p){const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);(p||art).appendChild(e);return e}

/* bunting */
const P0=[30,108],P1=[380,190],P2=[730,108], cols=['#cfe4f7','#fbf4e0','#f3d98a','#f7b9d0','#9cc4ea'];
el('path',{class:'k',d:'M30 108Q380 190 730 108'});
[['N',.22],['E',.28],['S',.34],['S',.40],['Y',.46],['2',.58],['5',.65],['',.76],['',.84],['',.92]].forEach((f,i)=>{
  const t=f[1],u=1-t,x=u*u*P0[0]+2*u*t*P1[0]+t*t*P2[0],y=u*u*P0[1]+2*u*t*P1[1]+t*t*P2[1];
  const dx=2*u*(P1[0]-P0[0])+2*t*(P2[0]-P1[0]),dy=2*u*(P1[1]-P0[1])+2*t*(P2[1]-P1[1]);
  const g=el('g',{transform:`translate(${x} ${y}) rotate(${Math.atan2(dy,dx)*57.3})`});
  el('path',{class:'k',d:'M-17 0H17L0 40z',style:`fill:${cols[i%5]}`},g);
  if(f[0]){const tx=el('text',{class:'t',x:0,y:23,'font-size':20,'text-anchor':'middle'},g);tx.textContent=f[0]}
  else el('use',{href:'#sp',x:-6,y:6,width:12,height:12},g);
});

/* fairy lights round the window */
el('path',{class:'k',d:'M36 322V150Q115 132 194 150V322','stroke-width':1.3});
for(let i=0;i<8;i++){const x=46+i*20,y=144-Math.sin((x-36)/158*Math.PI)*10+8;el('circle',{class:'k f3',cx:x,cy:y+2,r:4.2,'stroke-width':1.6})}

/* rug fringe */

/* wall doodles */
[[236,196,22],[250,334,16],[458,326,16]].forEach(s=>el('use',{href:'#sp',x:s[0],y:s[1],width:s[2],height:s[2]}));

/* photo album — edit captions here; photos are images/album1.jpg … album6.jpg */
const albumPages=[
 ['tiny ness','where the story begins'],
 ['toddler chaos','already making her own rules'],
 ['school days','notebooks and big dreams'],
 ['boss baby','the plot thickens'],
 ['The Fasion Icon', 'donatella versace who? i only know nessy'],

];
const albumImgs=['images/tiny.jpg','images/toddler.jpg','images/school.jpg','images/bossbaby.jpg','images/bowlcut.jpg','images/WhatsApp Image 2026-11-01 at 14.40.49.jpeg'];
const PG=(x,y,w)=>`<use href="#peng" x="${x}" y="${y}" width="${w}" height="${(w*1.3).toFixed(1)}"/>`;
const decos=[
 PG(30,22,34)+'<use href="#sp" x="10" y="10" width="16" height="16"/>',
 PG(6,24,34)+PG(42,30,30),
 PG(24,12,42)+'<path class="k f4" d="M28 32q16 9 32 0v8q-16 9-32 0z"/><path class="k f4" d="M52 40l3 16 7-3-4-14z"/>',

 PG(28,16,40)+'<use href="#sp" x="4" y="6" width="18" height="18"/><use href="#sp" x="66" y="14" width="14" height="14"/>'
];
const flake='<svg class="flake" viewBox="0 0 24 24"><path class="k" stroke-width="1.5" d="M12 2v20M3.5 7l17 10M20.5 7l-17 10M9 4l3 3 3-3M9 20l3-3 3 3"/></svg>';
function albumHTML(){
  const n=albumPages.length+1;
  let leaves=`<div class="leaf" style="z-index:${n}"><div class="face cover"><svg class="bigp" viewBox="0 0 40 52"><use href="#peng" width="40" height="52"/></svg><h3>nessy's album</h3><small>penguin edition</small></div><div class="face back"></div></div>`;
  albumPages.forEach((p,i)=>{
    leaves+=`<div class="leaf" style="z-index:${n-1-i}"><div class="face pg${i%2?' ice':''}">${flake}<div class="ph"><img src="${albumImgs[i]}" alt="${p[0]}"><i class="tape t1"></i><i class="tape t2"></i></div><div class="cap">${p[0]}</div><div class="sub">${p[1]}</div><svg class="deco" viewBox="0 0 90 72">${decos[i%decos.length]}</svg></div><div class="face back"></div></div>`;
  });
  return `<h2>photo album</h2><div class="album">${leaves}</div><div class="albumnav"><button class="nb" id="prevPg">‹ back</button><span id="pgNum"></span><button class="nb" id="nextPg">next ›</button></div><p style="text-align:center;font-size:1.05rem;margin:0">tap the page to turn it</p>`;
}
let curPg=0;
function initAlbum(){
  curPg=0;
  const leaves=[...document.querySelectorAll('.leaf')],total=leaves.length;
  const upd=()=>{
    document.getElementById('pgNum').textContent=curPg===0?'cover':`page ${curPg} of ${total-1}`;
    document.getElementById('prevPg').disabled=curPg===0;
    document.getElementById('nextPg').disabled=curPg>=total-1;
  };
  const next=()=>{if(curPg<total-1){leaves[curPg].classList.add('flipped');curPg++;upd()}};
  const prev=()=>{if(curPg>0){curPg--;leaves[curPg].classList.remove('flipped');upd()}};
  document.getElementById('nextPg').onclick=next;document.getElementById('prevPg').onclick=prev;
  leaves.forEach(l=>l.addEventListener('click',next));
  upd();
}


/* modal content */
const pol=(k,cap)=>{const posterPaths={gracie:'images/gracie.avif',taylor:'images/taylor.webp',jane:'images/jane.jpg'};return `<div class="pol one"><img src="${posterPaths[k]}" alt="${cap}">${cap}</div>`};
const content={
 music:`<div class="vinyl"></div><h2>music corner</h2><p>Every good room needs a soundtrack. This one's been playing softly since you walked in — turn it up, or let it hum while you look around.</p><div style="text-align:center"><button id="toggleMusic">pause the music</button></div>`,

  </p><p class="sig">"For the ultimate poet (not tortured, not today)."</p>`,
 album:albumHTML(),
 disco:`<h2>for you, on your 25th</h2><p>Happy 25th birthday, Nessy. A quarter of a century of being exactly, unmistakably you — the writer, the friend, the one who makes ordinary rooms feel like this one. Here's to every page still unwritten and every reason left to dance under a disco ball.</p>
 <p class="sig">— with love, always</p>`,
 gracie:`<h2>on repeat: gracie abrams</h2>${pol('gracie','gracie')}<p>The one you put on when a feeling needs company. Her songs have basically lived in your headphones — so she gets a spot on your wall.</p>`,
 taylor:`<h2>on repeat: taylor swift</h2>${pol('taylor','taylor')}<p>Obviously. An era for every mood you've ever had, and a lyric for every one you're about to.</p>`,
 jane:`<h2>currently watching: my lady jane</h2>${pol('jane','my lady jane')}<p>Every birthday room needs a show you made everyone else watch too. Corsets, chaos, a great soundtrack — exactly your kind of story.</p>`,
 cake:`<h2>make a wish!</h2><p>Close your eyes, think of something big, and blow out the candles. </p><p class="sig">happy birthday, nessy</p>`
};


const curtain=document.getElementById('curtain'),room=document.getElementById('room'),overlay=document.getElementById('overlay'),mc=document.getElementById('modalContent');
const backgroundMusic=document.getElementById('backgroundMusic');
let playing=false;
async function startMusic(){
  try{
    await backgroundMusic.play();
    playing=true;
  }catch(error){
    playing=false;
    console.error('Unable to play the background track:',error);
  }
}
async function toggleMusic(){
  if(backgroundMusic.paused){
    await startMusic();
  }else{
    backgroundMusic.pause();
    playing=false;
  }

  const button=document.getElementById('toggleMusic');
  if(button)button.textContent=playing?'pause the music':'play the music';
}
document.getElementById('enterBtn').addEventListener('click',()=>{
  startMusic();curtain.classList.add('hide');room.hidden=false;setTimeout(()=>{curtain.hidden=true},800);
  room.scrollLeft=(room.scrollWidth-room.clientWidth)/2;
  if(room.scrollWidth>room.clientWidth+20){const s=document.getElementById('swipe');s.classList.add('show');setTimeout(()=>s.classList.remove('show'),3500)}
});
function openModal(k){
  mc.innerHTML=content[k];overlay.classList.add('show');
  if(k==='music'){
    const button=document.getElementById('toggleMusic');
    button.textContent=playing?'pause the music':'play the music';
    button.addEventListener('click',toggleMusic);
  }
  if(k==='album')initAlbum();
  if(k==='cake')document.getElementById('flames').classList.add('out');
}
function closeModal(){overlay.classList.remove('show');setTimeout(()=>document.getElementById('flames').classList.remove('out'),1500)}
document.querySelectorAll('[data-key]').forEach(g=>g.addEventListener('click',()=>openModal(g.dataset.key)));
document.getElementById('closeModal').addEventListener('click',closeModal);
overlay.addEventListener('click',e=>{if(e.target===overlay)closeModal()});
  ['images/gracie.avif','images/taylor.webp','images/jane.jpg','images/discoball.jpg',...albumImgs]
  .forEach(src=>{const i=new Image();i.src=src});
